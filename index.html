<p style="font-size:12px;color:var(--mu)">Basado en la guía “Tema 1: Agua” (Cátedra de Bioquímica, Odontología UCV, Prof. Octavio R. Sánchez G.). Autoría del programa: Jorge Ñañez.</p></div>
<script>

function leer(t,btn){const S=window.speechSynthesis;if(!S)return say("Tu navegador no tiene lectura en voz alta.");if(S.speaking){S.cancel();return}const u=new SpeechSynthesisUtterance(t);u.lang="es-VE";u.rate=.95;S.speak(u)}
const L=[
["💧","Cohesión, adhesión, capilaridad y tensión superficial",`<ul><li><b>Cohesión</b>: fuerza que une moléculas de una misma sustancia (puentes de hidrógeno en el agua). <b>Adhesión</b>: une moléculas de sustancias diferentes.</li><li>Si cohesión &gt; adhesión la superficie es hidrofóbica (ángulo θ &gt; 90°, “el agua no moja”: hoja de loto, cera, teflón). Si adhesión &gt; cohesión es hidrofílica (θ &lt; 90°: vidrio limpio, algodón).</li><li><b>Capilaridad</b>: ascenso del líquido por conductos muy finos contra la gravedad, porque la adhesión con la pared supera la cohesión interna. Permite el flujo en espacios intersticiales y microvasos.</li><li><b>Tensión superficial</b>: energía necesaria para aumentar la superficie por unidad de área; la superficie actúa como una membrana elástica (por eso un insecto camina sobre el agua).</li><li>Alvéolos: la alta tensión tendería a colapsarlos; el <b>surfactante pulmonar</b> (lípidos y proteínas) la reduce. Los fosfolípidos regulan la tensión en las interfaces celulares.</li></ul><div class="d">🦷 <b>En odontología:</b> las mucinas de la saliva regulan la tensión superficial, protegen los tejidos blandos y lubrican. También importa en materiales de impresión (alginatos, siliconas), soluciones irrigadoras (NaClO) y adhesivos dentales: un buen “mojado” de la superficie dental mejora la adhesión.</div>`],
["🩸","Viscosidad",`<ul><li>Mide qué tan espeso es un fluido o cuánto se resiste a fluir.</li><li><b>Disminuye con el calor</b> (moléculas más rápidas y separadas) y <b>aumenta con el frío</b>.</li><li>Agua 0,69 cP · Saliva 1,05–1,50 cP (99 % agua, con mucinas, enzimas y sales) · Sangre 3,5–5,5 cP.</li><li>La viscosidad salival lubrica la boca, protege los dientes y forma el bolo alimenticio.</li></ul><div class="d">📝 <b>Aclaración de Jorge:</b> 0,69 cP corresponde al agua a ~37 °C (temperatura corporal). A 20 °C el agua vale cerca de 1,0 cP. Confirma con tu profesor qué referencia usa en el examen.</div>`],
["⚡","Constante dieléctrica",`<ul><li>Mide la capacidad de una sustancia para disminuir la fuerza de atracción entre dos cargas. En el agua vale <b>78</b> a temperatura corporal.</li><li>Debilita casi 80 veces la atracción entre iones: por eso separa sales como NaCl y los minerales se disuelven en sangre y células (“solvente universal”).</li><li>También evita que proteínas y ADN se deformen o se peguen entre sí de forma incorrecta.</li></ul>`],
["🔥","Cambios de estado y calor",`<ul><li><b>Punto de ebullición</b>: temperatura en que la presión de vapor del líquido iguala la presión del medio; 100 °C a nivel del mar. <b>Punto de fusión</b>: equilibrio sólido–líquido; 0 °C.</li><li><b>Calor específico</b>: calor para subir 1 °C a 1 g; el agua tiene valor muy alto (<b>1 cal/g·°C</b>). Cambia la temperatura sin cambiar de estado.</li><li><b>Calor latente</b>: cambia el estado sin cambiar la temperatura, porque rompe puentes de H y no aumenta la energía cinética. Fusión del hielo ≈ <b>80 cal/g</b>; vaporización = <b>540 cal/g</b> (720 − 180).</li><li>Importancia: menos fluctuaciones de temperatura en la célula (las enzimas trabajan a temperatura constante) y enfriamiento por evaporación: la <b>sudoración</b> impide una elevación brusca de la temperatura corporal.</li></ul>`],
["🧂","Propiedades coligativas y ósmosis",`<ul><li>Un soluto modifica el agua: ↓ presión de vapor, ↑ punto de ebullición, ↓ punto de fusión y ↑ presión osmótica (por eso se echa sal al hielo).</li><li><b>Ósmosis</b>: paso espontáneo de agua por una membrana semipermeable, desde donde hay menos soluto hacia donde hay más.</li><li><b>Osmolaridad</b>: osmoles (partículas disueltas) por litro. Líquidos corporales: 280–295 mOsm/L.</li><li><b>Isotónica</b>: medio externo = interno (el eritrocito no cambia). <b>Hipotónica</b>: externo &lt; interno (la célula absorbe agua y se hincha). <b>Hipertónica</b>: externo &gt; interno (pierde agua y se encoge; en plantas, plasmólisis).</li><li>Suero: NaCl 0,9 % y Ringer lactato (isotónicos, ~308 mOsm/L teóricos); NaCl 0,45 % (hipotónico); dextrosa 5 % en salina (hipertónico).</li></ul>`],
["⚗️","Ionización del agua, Kw y pH",`<ul><li>Autoionización (reversible y rápida): H₂O + H₂O ⇄ OH⁻ + H₃O⁺, o simplificada H₂O ⇄ H⁺ + OH⁻. Los iones duran poco; el agua es <b>anfótera</b> (el hidronio dona protones, el hidróxido los acepta).</li><li>[H₂O] pura = 1000 g ÷ 18 g/mol = <b>55,5 M</b>.</li><li>Keq = 1,8×10⁻¹⁶ M (conductividad del agua pura). Kw = 55,5 × Keq = [H⁺][OH⁻] = <b>1,0×10⁻¹⁴ M²</b>, constante a 25 °C.</li><li>Agua pura: [H⁺] = [OH⁻] = 10⁻⁷ M.</li></ul><div class="f">pH = −log[H⁺] &nbsp;|&nbsp; pOH = −log[OH⁻] &nbsp;|&nbsp; pH + pOH = 14</div><ul><li>pH &lt; 7 ácido · 7 neutro · &gt; 7 básico. Cada unidad = 10 veces más o menos H⁺. Medición: soluciones indicadoras, tiras reactivas, pHmetro.</li><li>Estos cálculos directos valen para ácidos y bases <b>fuertes</b>.</li></ul><div class="d">🦷 pH aproximado: HCl 1 M 0 · jugo gástrico 1,5 · tomate 4,2 · leche 6,5 · saliva ~6,8–7 · plasma 7,4 · jugo pancreático ~8 · amoníaco ~11,6 · NaOH 1 M 14. El esmalte comienza a desmineralizarse cerca de pH 5,5 (pH crítico), de ahí la caries.</div>`],
["🧪","Ácidos, bases y pKa",`<ul><li><b>Brønsted–Lowry</b>: ácido dona H⁺ (HCl, HNO₃, H₂SO₄); base acepta H⁺ (NH₃, Na₂CO₃).</li><li><b>Fuertes</b> se disocian por completo; <b>débiles</b> parcialmente (ácido acético ⇄ H⁺ + acetato, con constante Ka).</li></ul><div class="f">Ka = [H⁺][A⁻] / [HA] &nbsp;|&nbsp; pKa = −log Ka</div><ul><li>El pH mide la acidez de una solución; el pKa mide la fuerza ácida de un compuesto. <b>Mientras más fuerte es el ácido, menor es su pKa.</b></li></ul>`],
["🛡️","Soluciones tampón (buffer)",`<ul><li>Resisten cambios de pH al añadir pequeñas cantidades de ácido o base. Se forman con un <b>ácido débil</b> (dador de protones) y su <b>base conjugada</b> (aceptor).</li><li>Si entra ácido, la base conjugada capta H⁺; si entra base, el ácido débil capta OH⁻.</li><li>Ejemplo: acético/acetato (pKa 4,8). Máxima eficacia cuando [ácido] = [base conjugada].</li><li>Sangre: <b>CO₂ + H₂O ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻</b> (el pulmón elimina CO₂).</li></ul><div class="f">pH = pKa + log ([A⁻] / [HA])</div><ul><li>Si [A⁻] = [HA], log 1 = 0 y pH = pKa: <b>máxima capacidad amortiguadora</b>.</li><li><b>Curva de titulación</b>: se añade base de concentración conocida; la zona plana es el tampón y el punto medio (0,5 equivalentes de OH⁻) marca pH = pKa = 4,8.</li></ul><div class="d">🦷 La saliva se defiende de los ácidos de la placa con buffers (bicarbonato, fosfatos y proteínas). Menos saliva = menos amortiguación = más riesgo de caries.</div>`],
["🧬","Estructura del agua y puentes de hidrógeno",`<ul><li>La molécula de H₂O es <b>polar</b>: el oxígeno es parcialmente negativo (δ−) y los hidrógenos parcialmente positivos (δ+), con un ángulo de ~104,5°.</li><li>Cada molécula puede formar hasta <b>4 puentes de hidrógeno</b> con sus vecinas. Son débiles, pero numerosos: explican la cohesión, la tensión superficial, la capilaridad, los puntos de fusión y ebullición altos y el alto calor específico.</li><li>En el hielo los puentes forman una red abierta, por eso el hielo es <b>menos denso</b> que el agua líquida y flota.</li><li>Funciones biológicas: solvente de reacciones, transporte de nutrientes y desechos, termorregulación, lubricación y participación como reactivo (hidrólisis). Es ~60 % del peso corporal de un adulto.</li></ul><div class="d">🦷 Los puentes de H también mantienen hidratadas la dentina y las proteínas del esmalte; por eso el secado excesivo de la dentina afecta la adhesión de algunos sistemas adhesivos.</div>`],
["📋","Resumen y fórmulas clave",`<ul><li>Calor específico: 1 cal/g·°C · fusión: 80 cal/g · vaporización: 540 cal/g</li><li>Constante dieléctrica: 78 · viscosidad: agua &lt; saliva &lt; sangre</li><li>Líquidos corporales: 280–295 mOsm/L</li><li>[H₂O] = 55,5 M · Keq = 1,8×10⁻¹⁶ M · Kw = 10⁻¹⁴ M²</li></ul><div class="f">pH = −log[H⁺] · pOH = −log[OH⁻] · pH + pOH = 14<br>pKa = −log Ka · pH = pKa + log([A⁻]/[HA])</div><ul><li>Ácido fuerte → pKa bajo. Tampón: mejor eficacia cerca de pH = pKa (aprox. pKa ± 1).</li><li>Ósmosis: el agua va hacia el lado con más soluto.</li></ul>`],
["🦷","Casos clínicos para pensar",`<ul><li><b>Boca seca (xerostomía)</b>: menos saliva significa menos lubricación, menos bicarbonato y fosfatos (tampón) y menos arrastre de ácidos. Resultado: pH bajo más prolongado y mayor riesgo de caries.</li><li><b>Curva de Stephan</b>: tras ingerir azúcar el pH de la placa cae en minutos, puede bajar de 5,5 y se recupera gracias a la saliva y su capacidad tampón.</li><li><b>Irrigación endodóntica</b>: el NaClO debe mojar bien las paredes del conducto; una menor tensión superficial favorece que penetre en espacios muy pequeños (capilaridad).</li><li><b>Suero fisiológico</b>: NaCl 0,9 % es isotónico con las células; por eso se usa para irrigar sin dañarlas, mientras que el agua destilada sería hipotónica.</li></ul>`]];

["¿Qué fuerza mantiene unidas moléculas de la misma sustancia?","Cohesión","Adhesión","Viscosidad","Capilaridad","La cohesión actúa entre moléculas iguales; la adhesión, entre sustancias distintas."],
["¿Qué sustancia evita el colapso alveolar al bajar la tensión superficial?","Surfactante pulmonar","Mucina","Hemoglobina","Bicarbonato","Es una mezcla de lípidos y proteínas."],
["Al calentar un líquido, su viscosidad…","Disminuye","Aumenta","No cambia","Se duplica","Las moléculas se mueven más rápido y se separan."],
["La constante dieléctrica del agua a temperatura corporal es…","78","7","100","0,69","Debilita casi 80 veces la atracción entre cargas."],
["Calor de vaporización del agua:","540 cal/g","80 cal/g","1 cal/g","100 cal/g","Por eso sudar enfría tanto."],
["El calor latente no sube la temperatura porque se usa en…","Romper puentes de hidrógeno","Aumentar energía cinética","Formar iones","Subir la presión","No aumenta la energía cinética de las moléculas."],
["Al añadir un soluto al agua, el punto de ebullición…","Aumenta","Disminuye","Igual","Se anula","Propiedad coligativa: ↑ ebullición, ↓ fusión, ↓ presión de vapor."],
["En ósmosis el agua se mueve hacia…","El lado con más soluto","El lado con menos soluto","El lado más frío","Ninguno","Va de la zona más diluida a la más concentrada."],
["Un eritrocito en solución hipotónica…","Se hincha","Se encoge","No cambia","Se plasmoliza","Entra agua porque el medio externo tiene menos soluto."],
["[H⁺] del agua pura a 25 °C:","10⁻⁷ M","10⁻¹⁴ M","10⁻¹ M","55,5 M","Kw = [H⁺][OH⁻] = 10⁻¹⁴, y ambos valen lo mismo."],
["Si [H⁺] = 10⁻³ M, el pH es…","3","−3","11","7","pH = −log(10⁻³) = 3 (ácido)."],
["Un ácido más fuerte tiene…","Menor pKa","Mayor pKa","pKa = 7","pKa = 14","pKa = −log Ka; Ka grande da pKa pequeño."],
["Un tampón se compone de…","Ácido débil y su base conjugada","Ácido fuerte y base fuerte","Agua y sal","Dos ácidos fuertes","Uno dona y el otro acepta protones."],
["El tampón actúa mejor cuando…","pH = pKa","pH = 14","pH = 0","[A⁻] es mucho mayor","Con [A⁻] = [HA], log 1 = 0."],

["¿Por debajo de qué pH aprox. se desmineraliza el esmalte?","5,5","7,4","9","3","Es el pH crítico del esmalte."],
["¿Qué enlace une moléculas de agua entre sí?","Puente de hidrógeno","Enlace iónico","Enlace peptídico","Enlace metálico","Es débil, pero cada molécula forma hasta 4."],
["Calor específico del agua:","1 cal/g·°C","540 cal/g","80 cal/g","78","Su valor alto amortigua los cambios de temperatura celulares."],
["NaCl 0,9 % respecto al eritrocito es…","Isotónica","Hipotónica","Hipertónica","Anfótera","Misma concentración de soluto dentro y fuera."],
["Kw a 25 °C vale…","1×10⁻¹⁴ M²","1×10⁻⁷ M","55,5 M","1,8×10⁻¹⁶ M","Kw = 55,5 × 1,8×10⁻¹⁶."],
["Si pH = pKa, la relación [A⁻]/[HA] es…","1","10","0","0,1","log 1 = 0."],
["¿Qué componentes de la saliva actúan como tampón?","Bicarbonato y fosfatos","Mucinas solamente","Agua pura","Amilasa","Mantienen el pH frente a los ácidos de la placa."]];
const P=[["Cohesión","Une moléculas iguales"],["Adhesión","Une sustancias distintas"],["Capilaridad","Ascenso en tubos finos"],["Tensión superficial","Membrana elástica del líquido"],["Calor específico","1 cal/g·°C"],["Calor de vaporización","540 cal/g"],["Kw","1×10⁻¹⁴ M²"],["Tampón","Ácido débil + base conjugada"]];

const q=order[qi],op=sh(q.slice(1,5));say("Pregunta "+(qi+1)+" de "+order.length);a.innerHTML=`<div class="pg"><i style="width:${qi/order.length*100}%"></i></div><div class="c"><div class="b" style="display:block;padding-top:14px"><b>${q[0]}</b><div id="op"></div><div id="fb"></div></div></div>`;
op.forEach(o=>{const b=document.createElement("button");b.className="o1";b.textContent=o;b.onclick=()=>{document.querySelectorAll("#op .o1").forEach(x=>{x.disabled=true;if(x.textContent==q[1])x.classList.add("ok")});const g=o==q[1];if(g)sc++;else b.classList.add("no");say(g?"¡Correcto!":"Casi. Mira la explicación.");$("#fb").innerHTML=`<div class="d">${q[5]}</div><button class="btn p" id="nx">Siguiente</button>`;$("#nx").onclick=()=>{qi++;qs()}};$("#op").append(b)})}
V.j=()=>{say("Elige un juego: une conceptos, juega con el pH o decide qué le pasa a la célula.");$("#app").innerHTML=`<div class="ch"><button class="btn" onclick="gm()">🔗 Parejas</button><button class="btn" onclick="gp()">🧫 Laboratorio pH</button><button class="btn" onclick="go()">🩸 Ósmosis</button></div><div id="gx"></div>`;gm()};
function gm(){let sel=null,n=0;const A=sh(P.map(x=>x[0])),B=sh(P.map(x=>x[1])),g=$("#gx");g.innerHTML='<div class="g2" id="gr"></div>';say("Toca un concepto y luego su pareja.");const gr=$("#gr"),mk=(t,s)=>{const b=document.createElement("button");b.className="o1";b.textContent=t;b.dataset.s=s;b.onclick=()=>{if(!sel){sel=b;b.classList.add("sel");return}if(sel.dataset.s==s){sel.classList.remove("sel");sel=null;return}const l=s=="l"?b:sel,r=s=="r"?b:sel,ok=P.some(p=>p[0]==l.textContent&&p[1]==r.textContent);sel.classList.remove("sel");if(ok){l.classList.add("dn");r.classList.add("dn");n++;say(n==P.length?"¡Todas las parejas! 🎉":"¡Bien!")}else say("Esa no va. Prueba otra.");sel=null};return b};A.forEach((a,i)=>{gr.append(mk(a,"l"),mk(B[i],"r"))})}
function gp(){const g=$("#gx");g.innerHTML=`<div class="c"><div class="b" style="display:block;padding-top:12px"><b>Mueve el pH</b><input type="range" id="r" min="0" max="14" step=".5" value="7"><div class="big" id="pv"></div><p id="pt" style="text-align:center"></p></div></div><div class="c"><div class="b" style="display:block;padding-top:12px"><b>Reto:</b> <span id="rq"></span><div class="ch" id="ro"></div></div></div>`;const E=[[0,"HCl 1 M"],[1.5,"jugo gástrico"],[4.2,"jugo de tomate"],[6.5,"leche"],[7,"agua pura / saliva"],[7.4,"plasma sanguíneo"],[8,"jugo pancreático"],[11.5,"amoníaco"],[14,"NaOH 1 M"]],r=$("#r");const u=()=>{const p=+r.value,e=E.reduce((a,b)=>Math.abs(b[0]-p)<Math.abs(a[0]-p)?b:a);$("#pv").textContent="pH "+p;$("#pt").innerHTML=`[H⁺] = 10<sup>−${p}</sup> M · [OH⁻] = 10<sup>−${14-p}</sup> M<br>${p<7?"Ácido":p>7?"Básico":"Neutro"} · cercano a ${e[1]}`;say(p<7?"Más H⁺, más ácido.":p>7?"Más OH⁻, más básico.":"Neutro: H⁺ = OH⁻.")};r.oninput=u;u();rt();function rt(){const k=Math.floor(Math.random()*2);if(k==0){const n=1+Math.floor(Math.random()*13);$("#rq").innerHTML=`[H⁺] = 10<sup>−${n}</sup> M. ¿Cuál es el pH?`;ra(n,[n,14-n,n+1,Math.abs(n-2)])}else{const t=[[1,5.8],[.1,3.8],[1,4.8],[100,6.8],[.01,2.8]],p=t[Math.floor(Math.random()*5)],rr=p[0]==1?"1 (iguales)":String(p[0]);$("#rq").innerHTML=`Tampón acético/acetato (pKa 4,8) con [A⁻]/[HA] = ${rr}. ¿pH?`;ra(p[1],[p[1],p[1]+1,p[1]-1,4.8].filter((x,i,a)=>a.indexOf(x)==i))}}
function ra(c,o){const d=$("#ro");d.innerHTML="";sh(o).forEach(v=>{const b=document.createElement("button");b.className="btn";b.textContent=String(v).replace(".",",");b.onclick=()=>{if(v==c){say("¡Correcto!");setTimeout(rt,700)}else say("Revisa: pH = −log[H⁺] o pH = pKa + log(A⁻/HA).")};d.append(b)})}}
function go(){let i=0,s=0;const g=$("#gx"),sc=sh(O);(function n(){if(i>=sc.length){g.innerHTML=`<div class="c"><div class="b" style="display:block;text-align:center"><div class="big">${s}/${sc.length}</div><button class="btn p" onclick="go()">Otra vez</button></div></div>`;return}const o=sc[i];say("Un eritrocito (~0,9 % NaCl) queda en…");g.innerHTML=`<div class="c"><div class="b" style="display:block;padding-top:12px"><div class="big" style="font-size:22px">${o[0]}</div><div id="oo"></div><div id="of"></div></div></div>`;["Se hincha","Se encoge","No cambia"].forEach(t=>{const b=document.createElement("button");b.className="o1";b.textContent=t;b.onclick=()=>{const k=t==o[2];if(k)s++;b.classList.add(k?"ok":"no");say(k?"¡Exacto!":"No exactamente.");$("#of").innerHTML=`<div class="d">${o[1]}. Resultado: ${o[2].toLowerCase()}.</div><button class="btn p" id="nn">Siguiente</button>`;$("#nn").onclick=()=>{i++;n()}};$("#oo").append(b)})})()}
V.t=()=>{say("Pregúntame lo que quieras del tema.");$("#app").innerHTML=`<div class="ch">${["¿Qué es un buffer?","¿Por qué pH = pKa?","¿Qué es ósmosis?","¿Por qué sudamos?","¿Qué es el pH?","¿Y la saliva?"].map(q=>`<button class="btn s" onclick="ask('${q}')">${q}</button>`).join("")}</div><input type="text" id="qi" placeholder="Escribe tu duda (ej. Kw, viscosidad)"><div class="ch"><button class="btn p" onclick="ask($('#qi').value)">Preguntar</button></div><div id="ans"></div>`};
function ask(q){const s=q.toLowerCase(),f=F.find(x=>x[0].split(" ").some(w=>s.includes(w)))||F.find(x=>s.includes("pk"));const t=f?f[1]:"Aún no tengo esa respuesta. Prueba con: buffer, pH, Kw, ósmosis, sudor, viscosidad o saliva.";$("#ans").innerHTML=`<div class="d">${t}</div><button class="btn s" id="rd">🔊 Leer</button>`;$("#rd").onclick=()=>leer(t);say("Aquí tienes.")}
